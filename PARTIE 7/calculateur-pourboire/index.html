<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />

  <!-- IMPORTANT POUR MOBILE -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Calculateur de Pourboire</title>

  <!-- CHEMIN RELATIF -->
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <div class="container">
    <h1>Calculateur de Pourboire</h1>

    <label for="montant">
      Montant de l’addition (€)
    </label>

    <input
      type="number"
      id="montant"
      placeholder="Exemple : 42"
    />

    <label for="pourcentage">
      Pourcentage du pourboire
    </label>

    <select id="pourcentage">
      <option value="10">10%</option>
      <option value="15" selected>15%</option>
      <option value="20">20%</option>
    </select>

    <button id="calculer">
      Calculer
    </button>

    <div class="resultat">
      <p>Pourboire : <span id="tip">0 €</span></p>
      <p>Total : <span id="total">0 €</span></p>
    </div>
  </div>

  <!-- CHEMIN RELATIF -->
  <script src="script.js"></script>

</body>
</html>
