<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>États météo</title>

  <style>

    body {
      font-family: Arial, sans-serif;
      background: #F4F7FB;
      padding: 2rem;
      text-align: center;
    }

    h1 {
      color: #2E75B6;
    }

    .actions {
      margin-bottom: 2rem;
    }

    button {
      padding: 0.8rem 1.2rem;
      border: none;
      border-radius: 8px;
      background: #2E75B6;
      color: white;
      cursor: pointer;
      margin: 0 0.5rem;
      font-size: 1rem;
    }

    .cache {
      display: none;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #E0E0E0;
      border-top-color: #2E75B6;
      border-radius: 50%;
      animation: tourner 0.8s linear infinite;
      margin: 1rem auto;
    }

    @keyframes tourner {
      to {
        transform: rotate(360deg);
      }
    }

    #carte-meteo,
    #zone-erreur,
    #zone-chargement {
      max-width: 420px;
      margin: 2rem auto;
      background: white;
      border-radius: 16px;
      padding: 2rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    .temperature {
      font-size: 4rem;
      font-weight: bold;
      color: #2E75B6;
    }

    .description {
      font-size: 1.2rem;
      margin-bottom: 1rem;
    }

    .details {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
      margin-top: 1.5rem;
      text-align: left;
    }

    .detail {
      background: #F4F7FB;
      padding: 1rem;
      border-radius: 10px;
    }

    .error-message {
      color: #D32F2F;
      font-weight: bold;
      margin-bottom: 1rem;
    }

  </style>

</head>
<body>

  <h1>Tableau météo</h1>

  <div class="actions">
    <button id="btn-loading">
      Simuler chargement
    </button>

    <button id="btn-success">
      Simuler succès
    </button>

    <button id="btn-error">
      Simuler erreur
    </button>
  </div>



  <!-- Chargement -->

  <div id="zone-chargement" class="cache">

    <div class="spinner"></div>

    <p>Récupération de la météo...</p>

  </div>



  <!-- Carte météo -->

  <div id="carte-meteo" class="cache">

    <h2>Paris, FR</h2>

    <img
      src="https://openweathermap.org/img/wn/01d@2x.png"
      alt="Ciel dégagé"
    >

    <div class="temperature">
      18°C
    </div>

    <div class="description">
      Ciel dégagé
    </div>

    <div class="details">

      <div class="detail">
        Humidité : 72%
      </div>

      <div class="detail">
        Vent : 13 km/h
      </div>

      <div class="detail">
        Ressenti : 17°C
      </div>

      <div class="detail">
        Visibilité : 10 km
      </div>

    </div>

  </div>



  <!-- Zone erreur -->

  <div id="zone-erreur" class="cache">

    <p
      id="message-erreur"
      class="error-message"
    >
      Ville "Parisss" introuvable.
    </p>

    <button id="btn-reessayer">
      Réessayer
    </button>

  </div>



  <script>

    const zoneChargement =
      document.querySelector("#zone-chargement");

    const carteMeteo =
      document.querySelector("#carte-meteo");

    const zoneErreur =
      document.querySelector("#zone-erreur");



    function afficherChargement() {

      zoneChargement.classList.remove("cache");

      carteMeteo.classList.add("cache");

      zoneErreur.classList.add("cache");

    }



    function afficherSucces() {

      zoneChargement.classList.add("cache");

      zoneErreur.classList.add("cache");

      carteMeteo.classList.remove("cache");

    }



    function afficherErreur() {

      zoneChargement.classList.add("cache");

      carteMeteo.classList.add("cache");

      zoneErreur.classList.remove("cache");

    }



    document
      .getElementById("btn-loading")
      .addEventListener("click", afficherChargement);

    document
      .getElementById("btn-success")
      .addEventListener("click", afficherSucces);

    document
      .getElementById("btn-error")
      .addEventListener("click", afficherErreur);

  </script>

</body>
</html>
